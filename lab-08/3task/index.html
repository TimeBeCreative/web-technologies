<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Адаптивна фотогалерея на CSS Grid.">
    <title>Завдання 3 — фотогалерея CSS Grid</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="gallery.css">
</head>

<body>
    <a class="skip-link" href="#gallery">Перейти до галереї</a>
    <header class="page-header site-shell">
        <p class="eyebrow">Завдання 3 - парний варіант</p>
        <h1>Подорожі та місця</h1>
    </header>
    <main id="gallery" class="site-shell gallery-section">
        <div class="gallery-grid">
            <figure class="photo photo--1"><img src="../assets/photos/01-coast.jpg" alt="Зелена бухта та піщаний берег"></figure>
            <figure class="photo photo--main"><img src="../assets/photos/02-forest-trail.jpg" alt="Стежка серед зелених дерев"></figure>
            <figure class="photo photo--3"><img src="../assets/photos/03-hidden-cove.jpg" alt="Бірюзова вода у невеликій бухті"></figure>
            <figure class="photo photo--4"><img src="../assets/photos/04-mountain-stream.jpg" alt="Гірський потік серед каміння"></figure>
            <figure class="photo photo--5"><img src="../assets/photos/05-red-flowers.jpg" alt="Червоні квіти біля води"></figure>
            <figure class="photo photo--6"><img src="../assets/photos/06-street-tuk-tuk.jpg" alt="Міська вулиця та триколісний транспорт"></figure>
            <figure class="photo photo--7"><img src="../assets/photos/07-longtail-boat.jpg" alt="Довгохвостий човен на морі"></figure>
            <figure class="photo photo--8"><img src="../assets/photos/08-green-van.jpg" alt="Зелений автомобіль на вулиці"></figure>
            <figure class="photo photo--9"><img src="../assets/photos/09-stone-house.jpg" alt="Будинок серед квітів"></figure>
            <figure class="photo photo--10"><img src="../assets/photos/10-coffee-garden.jpg" alt="Чашка кави у саду"></figure>
        </div>
    </main>

</body>

</html>
