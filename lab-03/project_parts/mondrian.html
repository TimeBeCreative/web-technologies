<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Task 1 - table</title>
  <style type="text/css">
   table { border-collapse: collapse; width: 400px;}
   td { border: 5px solid #000; }
   tr {width: 60px; height: 60px; }
</style>
</head>
<body>
    <center>
        <h1>Завдання 2</h1>
        <table>
            <tr>
                <td colspan="2" bgcolor="#ffffff" ></td>
                <td colspan="2" bgcolor="#ffffff"></td>
                <td colspan="2" bgcolor="#fffa69"></td>
            </tr>
            <tr>
                <td bgcolor="#ffffff"></td>
                <td colspan="3" rowspan="2" bgcolor="#ff5b2d"></td>
                <td colspan="2" bgcolor="#fffa69"></td>
            </tr>

            <tr>
                <td rowspan="2" bgcolor="#ffffff"></td>
                <td bgcolor="#ffffff"></td>
                <td bgcolor="#ffffff"></td>
            </tr>

            <tr>
                <td colspan="2" rowspan="2" bgcolor="#000000"></td>
                <td bgcolor="#ffffff"></td>
                <td colspan="2" bgcolor="#ffffff"></td>
            </tr>
            <tr>
                <td rowspan="3" bgcolor="#fffa69"></td> 
                <td bgcolor="#ffffff"></td>
                <td colspan="2" rowspan="2" bgcolor="#074481"></td>
            </tr>
           <tr>
                <td colspan="2" rowspan="2" bgcolor="#ffffff"></td>
                <td bgcolor="#000000"></td>
           </tr>
           <tr>
                <td colspan="3" bgcolor="#ffffff"></td>
           </tr>

        </table>

        <br><br>
        <a href="../index.html">Назад</a>
    </center>
</body>
</html>
