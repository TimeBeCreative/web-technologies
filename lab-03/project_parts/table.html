<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Task 1 - table</title>
  <style type="text/css">
   table { border-collapse: collapse; width: 400px;}
   td { border: 5px solid #000; }
   tr {width: 60px; height: 60px; }
</style>
</head>
<body>
    <center>
        <h1>Завдання 1</h1>
        <table>
            <tr>
                <td colspan="12" bgcolor="#4D6CD1"></td>
            </tr>

            <tr>
                <td rowspan="6" bgcolor="#D1B24D"></td>
                <td colspan="8" bgcolor="#4D6CD1"></td>
                <td rowspan="6" bgcolor="#D1B24D"></td>
            </tr>

            <tr>
                <td rowspan="4" bgcolor="#D1B24D"></td>
                <td colspan="4" bgcolor="#4D6CD1"></td>
                <td rowspan="4" bgcolor="#D1B24D"></td>
            </tr>

            <tr>
                <td rowspan="2" bgcolor="#D1B24D"></td>
                <td bgcolor="#4DAED1"></td>
                <td bgcolor="#D1704D"></td>
                <td rowspan="2" bgcolor="#D1B24D"></td>
            </tr>

            <tr>
                <td bgcolor="#D1704D"></td>
                <td bgcolor="#4DAED1"></td>
            </tr>

            
            <tr>
                <td colspan="4" bgcolor="#4D6CD1"></td>
            </tr>

            <tr>
                <td colspan="8" bgcolor="#4D6CD1"></td>
            </tr>

            <tr>
                <td colspan="12" bgcolor="#4D6CD1"></td>
            </tr>
        </table>

        <br><br>
        <a href="../index.html">Назад</a>
    </center>
</body>
</html>
