        <header class="lesson-head">

            <h1>Introduction to Flexbox</h1>
            <p class="explain">`display: flex` створює flex-контекст. Типове значення напрямку — `row`, тобто елементи стоять у ряд.</p>
        </header>
        <section aria-label="Демонстрація властивостей flexbox">
            <h2>Живий приклад</h2>
            <div class="stage row">
                <div class="tile">1</div>
                <div class="tile">2</div>
                <div class="tile">3</div>
            </div>
        </section>
        <section>
            <h2>Основний CSS</h2>
            <pre>
                    <code>.container { display: flex; flex-direction: row; }</code>
                </pre>
        </section>
    </main>
