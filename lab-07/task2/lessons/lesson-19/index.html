<body>
    <main>

        <header class="lesson-head">
            <p class="eyebrow">Урок 19 / 20</p>
            <h1>Flexbox single line form</h1>
            <p class="explain">Для однорядкової форми поле може займати весь вільний простір, а кнопка зберігає природну ширину.</p>
        </header>
        <section aria-label="Демонстрація властивостей flexbox">
            <h2>Живий приклад</h2>
            <form class="stage single-form">
                <label class="sr" for="demo-email">Email</label>
                <input id="demo-email" type="email" placeholder="Your email">
                <button type="button">Subscribe</button>
            </form>
        </section>
        <section>
            <h2>Основний CSS</h2>
            <pre>
                    <code>form { display: flex; gap: 8px; } input { flex: 1; min-width: 0; }</code>
                </pre>
        </section>
    </main>
