<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>05. Flexbox Ordering</title>
    <link rel="stylesheet" href="../../reset.css">
    <link rel="stylesheet" href="../../shared.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <a class="back" href="../../index.html">← До списку уроків</a>
        <header class="lesson-head">
            <p class="eyebrow">Урок 05 / 20</p>
            <h1>Flexbox Ordering</h1>
            <p class="explain">`order` змінює візуальний порядок flex-елементів. DOM-порядок для читачів екрана не змінюється.</p>
        </header>
        <section aria-label="Демонстрація властивостей flexbox">
            <h2>Живий приклад</h2>
            <div class="stage ordering">
                <div class="tile">First</div>
                <div class="tile">Second</div>
                <div class="tile">Third</div>
            </div>
        </section>
        <section>
            <h2>Основний CSS</h2>
            <pre>
                    <code>.item--featured { order: -1; }</code>
                </pre>
        </section>
    </main>
</body>

</html>
